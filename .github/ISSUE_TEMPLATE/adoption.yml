name: Share adoption
description: Voluntarily confirm that you installed or evaluated Auto Model Router. No installer telemetry is sent.
title: "[Adoption]: "
labels:
  - adoption
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us distinguish real adoption from GitHub clone traffic.

        This issue is public. Do not include prompts, source code, customer information, credentials, or other private data.
  - type: dropdown
    id: stage
    attributes:
      label: Adoption stage
      description: Choose the closest description.
      options:
        - Installed and using it
        - Installed and evaluating it
        - Planning a team pilot
    validations:
      required: true
  - type: checkboxes
    id: hosts
    attributes:
      label: Hosts
      description: Where are you evaluating or using the skill?
      options:
        - label: Cursor
        - label: Claude Code
        - label: Codex
        - label: Gemini
        - label: Grok Build or another Agent Skills host
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Personal project
        - One team or repository
        - Multiple teams or repositories
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Optional outcome
      description: What outcome are you trying to improve? Keep it non-sensitive.
      placeholder: Reduce accidental use of expensive models for routine coding tasks.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public submission
      options:
        - label: I understand this issue is public and contains no private or sensitive information.
          required: true
